[package]
name = "pygamest"
version = "0.3.67"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "starfish 的 Python 绑定层：RustPython 内嵌壳 + pygame 绑定面（独立 crate，starfish 本体零 Python 资产）"

[features]
# ── 外接客人库开关（2026-10-24 feature 化；基座 + 维度细化）──
# 全部为**能力轴**（可选依赖的有无），与宿主方向无关——dev/runtime
# 两宿主同一张 pygame 模块面（2026-11-02 定约：宿主方向 feature
# 废除，net/dialog 无条件注册）。
# gui：与维度无关的 UI 库开关。
# physics：基座（拉依赖 + 公共桥）；实际维度开 physics2d / physics3d
#   （可同时开——rapier crate 的 dim2/dim3 命名空间天然并存）。
#   只开 physics 不开维度 = 仅依赖图就位，Python 面无 rapier 模块。
# 缺省 2D 全开保持现状；--no-default-features 轻量构建下对应 Python
# 子模块随之消失（import 即 AttributeError）。
default = ["gui", "physics2d"]
stdlib-full = ["rustpython-pylib/freeze-full"]
# click-through = 鼠标事件穿透（桌宠形态配套；穿透设计稿 M1——
# starfish-pygame click-through 能力位透传；Win32 实装，未启用 =
# pygame.display 两口不存在，编译期即知平台不支持）
click-through = ["starfish-pygame/click-through"]
# skip-taskbar = 任务栏（Dock）隐藏（桌宠配套——starfish-pygame
# 透传；Win32/macOS 实装，Linux Wayland 站桩，未启用 = pygame.display
# 两口不存在）
skip-taskbar = ["starfish-pygame/skip-taskbar"]
# tray = 系统托盘（桌宠配套——starfish-pygame 透传；三桌面实装，
# 未启用 = pygame.display 两口 + 事件三常量不存在）
tray = ["starfish-pygame/tray"]
gui = ["dep:egui-starfish-we", "dep:egui-wgpu"]
physics = ["dep:rapier-starfish-debug"]
physics2d = ["physics", "rapier-starfish-debug/2d"]
# 预留：3D 绑定面（pygame.rapier3d）随 3D 批次落地
physics3d = ["physics", "rapier-starfish-debug/3d"]
# spine = Spine 2D 骨骼动画（pygame_spine 适配 crate——阶段 4）
spine = ["dep:pygame_spine"]
# live2d = Live2D/Cubism 运行时（pygame_live2d——mocari vendored，阶段 4；
# 渲染管线 crate 内自理（pygame_live2d/render），本 crate 只做宏绑定）
live2d = ["dep:pygame_live2d", "pygame_live2d/render"]
# ozz = 3D 骨骼动画（pygame_ozz——ozz-animation-rs 适配；上游 std::simd 需 nightly 构建，不入 default）
ozz = ["dep:pygame_ozz"]

[dependencies]
starfish-std        = { git = "https://github.com/GuYeying/starfish", features = ["we"] }
starfish-debug      = { git = "https://github.com/GuYeying/starfish" }
starfish-we         = { git = "https://github.com/GuYeying/starfish" }
starfish-time       = { git = "https://github.com/GuYeying/starfish" }
starfish-permission = { git = "https://github.com/GuYeying/starfish" }
starfish-io         = { git = "https://github.com/GuYeying/starfish" }
starfish-net        = { git = "https://github.com/GuYeying/starfish" }
chacha20poly1305    = { version = "0.10", default-features = false, features = ["alloc"] }
starfish-gamepad    = { git = "https://github.com/GuYeying/starfish" }
starfish-render     = { git = "https://github.com/GuYeying/starfish" }
starfish-gfx        = { git = "https://github.com/GuYeying/starfish" }
starfish-font       = { git = "https://github.com/GuYeying/starfish" }
starfish-audio      = { git = "https://github.com/GuYeying/starfish" }
starfish-video      = { git = "https://github.com/GuYeying/starfish" }
starfish-pygame     = { git = "https://github.com/GuYeying/starfish" }

# ── 外接客人库（原生风格绑定面，2026-10-24 批次 42；feature 门控，见 [features]）──
# rapier 物理适配层（2D v1；default 为空，features 必显式；wgpu 版本
# 契约 30.0.1 与 starfish-render 同源解析）
rapier-starfish-debug = { git = "https://github.com/GuYeying/rapier-starfish-debug", features = ["2d"], optional = true }
pygame_spine = { path = "../pygame_spine", optional = true }
pygame_live2d = { path = "../pygame_live2d", optional = true }
pygame_ozz = { path = "../pygame_ozz", optional = true }
# egui 适配层（vendored fork；feature "render" 拉 egui-wgpu + starfish-render
# 桥 SfEguiRenderer；egui 经它重导出，本 crate 不直依赖 egui）
egui-starfish-we = { git = "https://github.com/GuYeying/egui-starfish-we", features = ["render"], optional = true }
# egui 绘制端（Renderer/ScreenDescriptor 类型面——egui-starfish-we 不重导出）
egui-wgpu = { version = "0.37.0", optional = true }
# wgpu 类型直依（渲染架构批次 C：ResourceAccess 包装层的内部桥接类型
# ——Buffer/BufferUsages/VertexFormat 等 Rust 侧使用；wgpu 裸对象
# 零出 Python 界的暴露面定约不变。版本与 starfish 同源合并单实例）
wgpu = { version = "30.0.1", default-features = false }



# math 绑定层的 glam 直绑（批次 K Vector3/Quaternion/Mat4；版本与 starfish
# 相同 semver → cargo 合并为同一实例，零重复）
glam = "0.33"
# dialog/io 同步绑定面的 block_on（批次 M；原生平台的 async API 本就是
# 阻塞实现体外壳——await 处即阻塞处，block_on 语义等价）
pollster = "0.4"
# Web 入口宏要求用户 crate 可见 wasm-bindgen（app_entry! 的 start 属性）
wasm-bindgen = "0.2.129"
# RustPython（vendor main 快照 0.6.0-dev，commit 23fcb8d9，2026-09-22）
# - default-features = false 去 host_env：wasm 必需（crt_fd 依赖不存在），
#   且 ctypes 恒不用（依赖双向规则的 C 能力替代 = 绑定面 Rust 原生函数）
# - freeze-stdlib：stdlib 冻结进二进制（无外部 Lib 依赖）
# - 三处 android 补丁见 src/rpy/dependencies/RustPython-main/（补丁①②③，
#   位置与缘由见 reference/rustpython改动备忘录.md）
rustpython-vm = { path = "src/rpy/dependencies/RustPython-main/crates/vm", default-features = false, features = [
    "compiler", "wasmbind", "gc", "stdio", "importlib", "encodings", "freeze-stdlib",
] }
# stdlib-full：dev 宿主全量冻结标准库（编辑器工具链面）——runtime 缺省 min
rustpython-pylib = { path = "src/rpy/dependencies/RustPython-main/crates/pylib", features = ["freeze-stdlib"] }
# RP 派生宏直依赖（批次 B 原生模块树）：pyclass/pymethod/pyattr 等宏的
# 权威来源——vm 根 re-export 的 glob 因同名冲突只导出部分宏
rustpython-derive = { path = "src/rpy/dependencies/RustPython-main/crates/derive" }

[[example]]
name = "rp_hello"

[[example]]
name = "sig_probe"

[[example]]
name = "sig_probe_android"
path = "examples/sig_probe.rs"
crate-type = ["cdylib"]

# ── M1 绑定面探针：标准 pygame 写法（原生 pygame 模块 + with 会话渲染）──
[[example]]
name = "binding_probe"

[[example]]
name = "binding_probe_android"
path = "examples/binding_probe.rs"
crate-type = ["cdylib"]

# ── 逐模块独立测试案例迁移（2026-10-26 定约）：脚本形态归 pygamest-dev
# （python.exe examples/<名>.py 直跑）；APK 壳（*_android cdylib）随迁
# pygamest-dev/examples/——本仓 example 仅存 Rust 级 API 探针
#（rp_hello / sig_probe / binding_probe）
# Web：异步 IO 桥（step_coro 的 fetch spawn_local——异步化批次1）
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", default-features = false }
wasm-bindgen-futures = "0.4"

# vello_common 0.2.0 strip 光栅化 NaN 防御（vendor 本地补丁）：模拟器
# Noto CJK 新版特定字形 outline 含 NaN → tile.line_idx 垃圾值越界 panic
# → egui epaint 字形渲染全链炸（模拟器黑屏实测）。上游 0.2.0 已最新未修
# ——防御式 get 兜底跳坏 tile，待上游修复后整体撤除
[patch.crates-io]
vello_common = { path = "vendor/vello_common" }
